<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kura.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{colors:{saffron:"#F5B301","on-surface":"#151c27","on-surface-variant":"#46464b",outline:"#68686d","outline-variant":"#c7c6cb","surface-container-lowest":"#fff","surface-container-low":"#f0f3ff","surface-container":"#e7eefe","surface-container-highest":"#dce2f3","surface-variant":"#dce2f3",primary:"#000","on-primary":"#fff","primary-container":"#1a1b1f","secondary-container":"#febb14","on-secondary-container":"#6c4d00",secondary:"#7b5800","secondary-fixed":"#ffdea5","on-secondary-fixed-variant":"#5d4200","tertiary-fixed":"#8af8b9","on-tertiary-fixed-variant":"#005230","on-tertiary-container":"#13814f","tertiary-fixed-dim":"#6bdb9e",error:"#ba1a1a","error-container":"#ffdad6","on-error-container":"#93000a"},fontSize:{"body-sm":["12px",{lineHeight:"16px"}],"body-md":["14px",{lineHeight:"20px"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"500"}],"label-sm":["11px",{lineHeight:"14px",letterSpacing:".05em",fontWeight:"700"}],"label-md":["12px",{lineHeight:"16px",letterSpacing:".02em",fontWeight:"600"}],"label-lg":["14px",{lineHeight:"20px",fontWeight:"600"}],"headline-sm":["18px",{lineHeight:"24px",letterSpacing:"-.01em",fontWeight:"600"}],"headline-md":["20px",{lineHeight:"28px",letterSpacing:"-.01em",fontWeight:"700"}],"headline-lg":["24px",{lineHeight:"32px",letterSpacing:"-.02em",fontWeight:"700"}],"display-lg":["36px",{lineHeight:"44px",letterSpacing:"-.03em",fontWeight:"800"}]}}}}</script>
<style>
:root{color-scheme:light}
html,body{margin:0;height:100%;background:#fff;font-family:Manrope,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{color:#151c27;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.pb-safe{padding-bottom:max(env(safe-area-inset-bottom,0px),12px)}
::-webkit-scrollbar{display:none}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500;font-size:24px;line-height:1;user-select:none}
.fill{font-variation-settings:'FILL' 1,'wght' 500}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid #151c27;outline-offset:2px}
.veil{clip-path:circle(150% at 50% 40%);animation:veil 1s .4s cubic-bezier(.7,0,.2,1) forwards}
@keyframes veil{70%{clip-path:circle(46px at 50% 40%);opacity:1}100%{clip-path:circle(46px at 50% 40%);opacity:0;visibility:hidden}}
.pop{opacity:0;animation:pop .6s 1.1s cubic-bezier(.16,1,.3,1) forwards}
.rise{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes rise{to{opacity:1;transform:none}}
.sh{animation:sh .28s cubic-bezier(.16,1,.3,1)}@keyframes sh{from{transform:translateY(100%)}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.toast{animation:rise .3s forwards}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style></head>
<body><div id="app"></div><div id="sheet"></div><div id="toast" role="status" aria-live="polite" class="fixed left-0 right-0 bottom-24 z-[90] flex justify-center pointer-events-none"></div>
<script>
const $=s=>document.querySelector(s),K='kura.v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

const okPh=p=>{const d=String(p).replace(/\D/g,'');return d.length>=9&&d.length<=15};
const cents=s=>{s=String(s).replace(/[,\s]/g,'');if(!/^\d{0,9}(\.\d{0,2})?$/.test(s)||!/\d/.test(s))return null;const[w,f='']=s.split('.');const v=(+(w||0))*100+(+(f.padEnd(2,'0')||0));return v>0?v:null};
const amtErr=r=>{r=String(r).replace(/[,\s]/g,'');return /[^\d.]|\..*\./.test(r)?'Use numbers only, like 150.50':/\.\d{3,}/.test(r)?'Use at most 2 decimal places':/^\d{10,}/.test(r)?'That amount is too large':'Enter an amount above 0'};
const cleanCur=s=>String(s||'GH₵').replace(/[<>&"'`\\]/g,'').trim().slice(0,5)||'GH₵';
function cleanList(l){const seen=new Set,ok=i=>typeof i=='string'&&/^[a-z0-9]{3,20}$/.test(i);return(Array.isArray(l)?l:[]).filter(c=>c&&typeof c.name=='string'&&c.name.trim()&&Array.isArray(c.tx)).map(c=>{const id=ok(c.id)&&!seen.has(c.id)?c.id:uid();seen.add(id);const s=new Set;return{...c,id,name:c.name.trim().slice(0,60),phone:String(c.phone||'').slice(0,30),loc:String(c.loc||'').slice(0,80),type:c.type=='supplier'?'supplier':'customer',created:Number.isFinite(c.created)?c.created:0,tx:c.tx.filter(t=>t&&Number.isSafeInteger(t.amt)&&t.amt!==0&&Number.isFinite(t.ts)).map(t=>{const i=ok(t.id)&&!s.has(t.id)?t.id:uid();s.add(i);return{...t,id:i,note:String(t.note||'').slice(0,120)}})}})}

const seed=()=>{const d=864e5,n=Date.now(),m=(name,phone,type,tx)=>({id:uid(),name,phone,type,tx:tx.map(([amt,note,ago])=>({id:uid(),amt:amt*100,note,ts:n-ago*d}))});
return[m('Ama Serwaa','0244123456','customer',[[420,'Rice and oil',2]]),m('Kojo Mensah','0200111222','customer',[[1000,'Weekly provisions',6],[-150,'Part payment',0]]),m('Efua Boateng','0551234567','customer',[[300,'Tomatoes and onions',5]]),m('Wholesale Depot','0302123456','supplier',[[-700,'Stock on credit',1]]),m('Yaw Owusu','0277654321','customer',[[185,'Soap and sugar',7]])]};
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!D||!Array.isArray(D.list))D={v:2,trash:[],user:'',biz:'',phone:'',loc:'',pin:null,onboarded:false,list:[]};
D.trash=Array.isArray(D.trash)?D.trash:[];if(!D.v){D.list.forEach(c=>(c.tx||[]).forEach(t=>t.amt=Math.round(t.amt*100)));D.v=2}D.list=cleanList(D.list);D.trash=cleanList(D.trash);D.cur=cleanCur(D.cur);D.cc=String(D.cc||'233').replace(/\D/g,'')||'233';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){toast('Couldn’t save on this device. Back up your data now.');return false}};
const S={ct:'customer',screen:'splash',tab:'customers',filter:'all',q:'',detail:null,slide:0,buf:'',first:'',pm:'set',msg:''};
const bal=c=>c.tx.reduce((a,t)=>a+(t.void?0:t.amt),0);
const act=c=>c.tx.reduce((m,t)=>t.void?m:Math.max(m,t.ts),0),last=c=>Math.max(act(c),c.created||0);
const money=n=>{const a=Math.abs(Math.round(n));return(D.cur||'GH₵')+' '+Math.floor(a/100).toLocaleString('en-GH')+'.'+String(a%100).padStart(2,'0')};
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>[...w][0]).join('').toUpperCase();
const sd=t=>{const x=new Date(t);return new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime()};const ago=ts=>{if(!ts)return'No activity yet';const d=Math.round((sd(Date.now())-sd(ts))/864e5);return d<=0?'Today':d==1?'Yesterday':d<7?d+' days ago':d<30?Math.floor(d/7)+(d<14?' week ago':' weeks ago'):Math.floor(d/30)+(d<60?' month ago':' months ago')};
const avatars=['bg-surface-container-highest text-on-tertiary-container','bg-secondary-fixed text-on-secondary-fixed-variant','bg-surface-variant text-primary-container','bg-error-container text-on-error-container','bg-surface-container text-primary'];
const hue=n=>avatars[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%avatars.length];
const book=s=>`<svg width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 32 32"><path d="M16 8.5C13.2 6.2 8.5 6.2 4.5 7.4V24.5C8.8 23.3 13.2 23.6 16 25.8C18.8 23.6 23.2 23.3 27.5 24.5V7.4C23.5 6.2 18.8 6.2 16 8.5Z"/><path d="M16 8.5V25.8M8 12.5h4.5M8 16.5h4.5M19.5 12.5H24M19.5 16.5H24"/></svg>`;
const ic=(n,c='')=>`<span class="material-symbols-outlined ${c}">${n}</span>`;
const inp='w-full h-12 px-4 rounded-xl bg-surface-container-low text-body-lg outline-none focus:ring-2 focus:ring-secondary-container';
const btnP='w-full h-[52px] bg-primary text-on-primary text-label-lg rounded-[14px] flex items-center justify-center gap-2 active:scale-[.99] transition';
const wrap='w-full max-w-[540px] mx-auto px-4';
const fld=(id,l,ph,v='',x='')=>`<div><label for="${id}" class="text-label-md text-on-surface-variant mb-1 block">${l}</label><input id="${id}" class="${inp}" value="${esc(v)}" placeholder="${ph}" ${x}><p id="${id}-e" role="alert" class="hidden text-body-sm text-error mt-1"></p></div>`;

/* ---------- views ---------- */
function splash(){return`<div data-a="skip-splash" class="fixed inset-0 bg-white flex flex-col items-center justify-between px-6 py-10">
<div class="veil fixed inset-0 z-10 bg-saffron flex items-center justify-center text-primary">${book(44)}</div>
<div></div>
<div class="flex flex-col items-center text-center">
<div class="pop relative w-[92px] h-[92px] rounded-[24px] bg-saffron flex items-center justify-center text-primary" style="box-shadow:0 12px 28px -6px rgba(245,179,1,.4)">${book(44)}</div>
<h1 class="rise text-[42px] font-bold tracking-tight mt-6" style="animation-delay:1.3s">Kura<span class="text-saffron font-black">.</span></h1>
<p class="rise text-base text-outline mt-1" style="animation-delay:1.5s">Know who owes you.</p></div>
<div class="rise flex flex-col items-center gap-2" style="animation-delay:1.8s">
<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-surface-container-low">${ic('lock','!text-[15px] text-outline')}<span class="text-label-md text-on-surface-variant">Offline-first. Stored on your device.</span></div>
<span class="text-body-sm text-outline">Simple credit ledger</span></div></div>`}

const slides=[
{t:'Record credit in seconds',p:'Log what customers take on credit from your phone. Never lose track of a single cedi.',h:`<div class="relative w-full max-w-[280px]"><div class="absolute -top-3 right-3 z-10 flex items-center gap-1 bg-white px-2.5 py-1 rounded-full shadow-sm text-on-tertiary-container">${ic('check_circle','!text-[16px]')}<span class="text-label-sm">SAVED</span></div>
<div class="bg-white rounded-xl p-4 shadow-sm"><div class="flex justify-between items-center pb-2 mb-2 border-b border-surface-container-highest"><div><p class="text-label-sm text-on-surface-variant">New credit entry</p><p class="text-label-lg">Kofi Mensah</p></div><span class="text-label-md text-outline">Just now</span></div>
<div class="space-y-2 mb-3 text-body-sm text-on-surface-variant"><div class="flex justify-between"><span>2× Jasmine rice (5kg)</span><b class="text-on-surface">GH₵ 180.00</b></div><div class="flex justify-between"><span>1× Cooking oil</span><b class="text-on-surface">GH₵ 65.00</b></div></div>
<div class="flex justify-between items-center bg-surface-container-low px-3 py-2 rounded-lg"><span class="text-label-sm text-on-surface-variant">Balance due</span><span class="text-headline-sm font-bold">GH₵ 245.00</span></div></div></div>`},
{t:'Remind on WhatsApp',p:'Send a friendly reminder with the exact amount owed in one tap. No awkward conversations.',h:`<div class="w-full max-w-[280px] space-y-2"><div class="bg-white rounded-xl rounded-bl-sm p-3 shadow-sm text-body-md">Hello Ama, a friendly reminder of your balance of <b>GH₵ 420</b>. Thank you!</div><div class="ml-auto w-fit bg-tertiary-fixed text-on-tertiary-fixed-variant rounded-xl rounded-br-sm px-3 py-2 text-body-md">Will pay tomorrow 🙏</div></div>`},
{t:'Money at a glance',p:'See who owes you, who you owe and your net balance the moment you open the app.',h:`<div class="w-full max-w-[280px] bg-white rounded-xl p-4 shadow-sm"><p class="text-label-md text-on-surface-variant">Net balance</p><p class="text-headline-lg mb-3">GH₵ 1,055</p><div class="h-2 rounded-full overflow-hidden flex bg-surface-variant"><div class="bg-on-tertiary-container" style="width:71%"></div><div class="bg-error" style="width:29%"></div></div><div class="flex justify-between text-body-sm text-on-surface-variant mt-1.5"><span>Owed to you</span><span>You owe</span></div></div>`}];
function onboard(){const s=slides[S.slide],l=S.slide==2;return`<div class="${wrap} min-h-dvh flex flex-col pb-safe">
<div class="flex items-center justify-between py-2 mb-3"><div class="flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-secondary-container"></i><span class="text-label-md text-on-surface-variant">Kura ledger</span></div>${l?'<span class="w-12"></span>':'<button data-a="skip-onb" class="text-label-lg text-outline px-2.5 py-1 rounded-lg">Skip</button>'}</div>
<div class="rounded-xl bg-surface-container-low min-h-[300px] flex items-center justify-center p-6 overflow-hidden">${s.h}</div>
<div class="flex justify-center gap-1.5 my-6">${slides.map((_,i)=>`<i class="h-2 rounded-full transition-all ${i==S.slide?'w-6 bg-primary':'w-2 bg-surface-container-highest'}"></i>`).join('')}</div>
<div class="text-center mb-6"><h1 class="text-headline-lg mb-1">${s.t}</h1><p class="text-body-lg text-on-surface-variant max-w-[380px] mx-auto">${s.p}</p></div>
<div class="mt-auto"><button data-a="next" class="${btnP}">${l?'Get started':'Next'}${ic(l?'check':'arrow_forward','!text-[20px]')}</button></div></div>`}

function profile(){return`<div class="${wrap} min-h-dvh flex flex-col pb-safe"><div class="flex items-center justify-between py-2 h-12"><button data-a="prof-back" aria-label="Back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center">${ic('arrow_back')}</button><span class="px-3 py-1 bg-surface-container-low rounded-full text-label-sm text-on-surface-variant">Step 1 of 3</span><span class="w-10"></span></div>
<div class="flex flex-col items-center text-center mt-3 mb-6"><div class="relative w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center mb-4"><i class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-secondary-container"></i>${ic('storefront','!text-[32px]')}</div><h1 class="text-headline-lg">Set up your profile</h1><p class="text-body-md text-on-surface-variant mt-2 max-w-[300px]">Tell us who’s running this ledger. You can change this later in Settings.</p></div>
<div class="flex flex-col gap-3.5">${fld('p-name','Your name','e.g. Kwame Ansah',D.user,'autocomplete="name"')}${fld('p-biz','Business name (optional)','e.g. Kwame’s Provisions',D.biz||'')}${fld('p-phone','Phone number (optional)','e.g. 024 123 4567',D.phone||'','inputmode="tel"')}${fld('p-loc','Business location (optional)','e.g. Madina market, Accra',D.loc||'')}</div>
<div class="mt-auto pt-6"><button data-a="save-profile" class="${btnP}">Continue${ic('arrow_forward','!text-[20px]')}</button></div></div>`}
const keys=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']];
const dots=()=>[0,1,2,3].map(i=>`<i class="w-4 h-4 rounded-full transition-all duration-200 ${i<S.buf.length?'bg-primary ring-4 ring-primary/10 scale-105':'bg-surface-container-highest'}"></i>`).join('');
function pin(){const m={set:['Protect your ledger','Set a 4-digit PIN to lock your records on this device.'],confirm:['Confirm your PIN','Enter the same 4 digits again.'],lock:['Welcome back, '+esc(D.user),'Enter your PIN to open your ledger.']}[S.pm];
const kb=(k,l)=>`<button data-a="key" data-v="${k}" class="w-[72px] h-[72px] rounded-full bg-surface-container-low active:bg-secondary-fixed active:scale-95 transition flex flex-col items-center justify-center"><span class="text-headline-lg leading-none">${k}</span><span class="text-[9px] opacity-60 tracking-widest h-3">${l}</span></button>`;
return`<div class="${wrap} min-h-dvh flex flex-col pb-safe"><div class="flex items-center justify-between py-2 h-12">${S.pm=='confirm'?`<button data-a="pin-back" aria-label="Back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center">${ic('arrow_back')}</button>`:'<span class="w-10"></span>'}${S.pm!='lock'&&S.setup?`<span class="px-3 py-1 bg-surface-container-low rounded-full text-label-sm text-on-surface-variant">Step 3 of 3</span>`:''}<span class="w-10"></span></div>
<div class="flex flex-col items-center text-center mt-3"><div class="relative w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center mb-4"><i class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-secondary-container"></i>${ic('pin','!text-[32px]')}</div><h1 class="text-headline-lg">${m[0]}</h1><p class="text-body-md text-on-surface-variant mt-2 max-w-[290px]">${m[1]}</p></div>
<div class="flex flex-col items-center my-7"><div id="track" class="flex gap-5 p-3">${dots()}</div><span id="pmsg" class="text-label-md mt-1 ${S.err?'text-error':'text-on-surface-variant'}">${S.msg||'&nbsp;'}</span></div>
<div class="grid grid-cols-3 gap-y-4 place-items-center max-w-[300px] mx-auto w-full">${keys.map(k=>kb(...k)).join('')}<span></span>${kb('0','')}<button data-a="del" aria-label="Delete" class="w-[72px] h-[72px] rounded-full flex items-center justify-center text-on-surface-variant active:scale-95">${ic('backspace')}</button></div>
${S.pm=='set'?'<div class="flex justify-center mt-5"><button data-a="skip-pin" class="px-6 py-3 rounded-full text-label-lg text-on-surface-variant">Skip for now</button></div>':S.pm=='lock'?'<div class="flex justify-center mt-5"><button data-a="forgot" class="px-6 py-3 rounded-full text-label-lg text-on-surface-variant">Forgot PIN?</button></div>':''}</div>`}

const lists=()=>{let a=D.list.filter(c=>(S.filter=='all'||(S.filter=='owe_me'?bal(c)>0:bal(c)<0))&&(!S.q||(c.name+' '+(c.phone||'')+' '+(c.loc||'')+' '+String(c.phone||'').replace(/\D/g,'')).toLowerCase().includes(S.q))).sort((x,y)=>last(y)-last(x));
if(!a.length)return`<div class="flex flex-col items-center py-12 text-center"><div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center mb-4">${ic('person_search','!text-[30px] text-outline')}</div><span class="text-headline-sm mb-1">${D.list.length?'No one found':'Your ledger is empty'}</span><span class="text-body-md text-on-surface-variant max-w-xs mb-4">${D.list.length?'Try a different name or number, or clear the filter.':'Add your first customer to start tracking who owes you.'}</span>${D.list.length?'':`<button data-a="add" class="h-12 px-6 rounded-full bg-secondary-container text-on-secondary-container text-label-lg font-bold">Add your first customer</button><button data-a="imp-open" class="mt-2 h-12 px-6 rounded-full bg-surface-container-low text-label-lg">Import contacts</button>`}</div>`;
return a.map(c=>{const b=bal(c),d=act(c)?(Date.now()-act(c))/864e5:0,cu=c.type=='customer',dot=cu&&b>0&&d>14?'bg-error':cu&&b>0&&d>7?'bg-secondary-container':'';return`<div data-a="open" data-v="${c.id}" role="button" tabindex="0" class="flex items-center justify-between gap-2 p-3.5 rounded-2xl bg-white ring-1 ring-black/5 shadow-[0_1px_3px_rgba(21,28,39,.05)] active:scale-[.99] transition cursor-pointer"><div class="flex items-center gap-3 min-w-0"><div class="relative w-12 h-12 rounded-full flex items-center justify-center shrink-0 text-headline-sm ${hue(c.name)}">${esc(ini(c.name))}${dot?`<i class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full ring-2 ring-white ${dot}"></i>`:''}</div><div class="min-w-0"><div class="flex items-center gap-1"><span class="text-body-lg font-semibold truncate">${esc(c.name)}</span>${c.type=='supplier'?ic('store','!text-[15px] text-on-surface-variant'):''}</div><span class="text-body-sm text-on-surface-variant truncate block">${ago(act(c))}${c.loc?' · '+esc(c.loc):''}</span></div></div>
<div class="flex flex-col items-end shrink-0"><span class="text-headline-sm font-bold ${b>0?'text-on-tertiary-container':b<0?'text-error':'text-outline'}">${money(b)}</span><span class="mt-0.5 px-2 py-0.5 rounded-full text-label-sm ${b>0?'bg-tertiary-fixed text-on-tertiary-fixed-variant':b<0?'bg-error-container text-on-error-container':'bg-surface-container text-on-surface-variant'}">${b>0?'owes you':b<0?'you owe':'settled'}</span></div></div>`}).join('')};

const tot=()=>{let o=0,w=0,no=0,nw=0;D.list.forEach(c=>{const b=bal(c);if(b>0){o+=b;no++}else if(b<0){w-=b;nw++}});return{o,w,no,nw,net:o-w}};
const now=()=>{const d=new Date();return d.toLocaleDateString('en-GH',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('en-GH',{hour:'numeric',minute:'2-digit',hour12:true})};
const hello=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
function customersTab(){const t=tot(),p=t.o+t.w?Math.round(t.o/(t.o+t.w)*100):0,q=t.o+t.w?100-p:0,n=f=>D.list.filter(c=>f=='all'||(f=='owe_me'?bal(c)>0:bal(c)<0)).length;
const od=D.list.filter(c=>c.type=='customer'&&bal(c)>0&&act(c)&&Date.now()-act(c)>7*864e5),odSum=od.reduce((s,c)=>s+bal(c),0);

const close=()=>$('#sheet').innerHTML='';
function afterStart(){go('profile')}
const wa=p=>{p=String(p).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);const cc=D.cc||'233';if(p.startsWith('0'))p=cc+p.slice(1);else if(p.length==9)p=cc+p;return p};

function pinDone(){const ok=()=>{S.buf='';S.msg='';S.err=false};
if(S.pm=='set'){S.first=S.buf;S.pm='confirm';ok();render()}
else if(S.pm=='confirm'){if(S.buf==S.first){setPin(S.buf)}else{S.pm='set';bad('Codes don’t match. Start again.')}}
else{tryUnlock()}}
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode((D.salt||'')+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa((D.salt||'')+p)}}
async function setPin(p){D.salt=uid()+uid();D.pin=await hp(p);D.tries=0;D.lockUntil=0;save();toast('PIN set. Your ledger is locked.');enter()}
async function tryUnlock(){const w=(D.lockUntil||0)-Date.now();if(w>0)return bad('Too many tries. Wait '+Math.ceil(w/1000)+' seconds.');
const ok=D.salt?await hp(S.buf)==D.pin:btoa(S.buf)==D.pin;
if(ok){if(!D.salt){const p=S.buf;D.salt=uid()+uid();D.pin=await hp(p)}D.tries=0;D.lockUntil=0;save();return enter()}
D.tries=(D.tries||0)+1;if(D.tries>=5){D.lockUntil=Date.now()+30000*Math.min(2**(D.tries-5),20);save();bad('Too many tries. Locked for a while.')}else{save();bad('Wrong PIN. '+(5-D.tries)+' tries left.')}}
function bad(m){const t=$('#track');t&&t.classList.add('shake');setTimeout(()=>{S.buf='';S.msg=m;S.err=true;render()},350)}

const txMeta={give:['Gave credit',1,'What did they take?'],get:['Got payment',-1,'Note (optional)'],buy:['Bought on credit',-1,'What did you buy?'],pay:['I paid',1,'Note (optional)']};
const chkPh=(p,id)=>{if(!p)return'';const d=p.replace(/\D/g,'');if(d.length<9||d.length>15)return'Enter a valid phone number, or leave it empty';const o=D.list.find(c=>c.id!=id&&String(c.phone||'').replace(/\D/g,'').slice(-9)==d.slice(-9));return o?o.name+' already has this number':''};
const A={
next(){S.slide<2?(S.slide++,render()):afterStart()},
'skip-onb'(){afterStart()},
key(v){if(S.buf.length>=4)return;S.buf+=v;$('#track').innerHTML=dots();S.msg='';$('#pmsg').textContent='';if(S.buf.length==4)setTimeout(pinDone,180)},
del(){S.buf=S.buf.slice(0,-1);$('#track').innerHTML=dots()},
'pin-back'(){S.pm='set';S.buf='';S.msg='';render()},
'skip-pin'(){enter()},
tab(v){S.tab=v;S.q='';S.screen='main';render()},
filter(v){S.filter=v;render()},
jump(v){S.filter=v;S.q='';render();setTimeout(()=>$('#list')?.scrollIntoView({behavior:'smooth',block:'start'}),60)},
open(v){S.detail=v;S.screen='detail';try{history.pushState({d:1},'')}catch(e){}render()},
back(){if(history.state&&history.state.d)history.back();else{S.screen='main';render()}},
close,
type(v,el){S.t=v;el.parentNode.querySelectorAll('button').forEach(b=>b.className='h-11 rounded-xl text-label-lg '+(b==el?'bg-primary text-on-primary':'bg-surface-container-low'))},
'copy-msg'(){try{navigator.clipboard.writeText(S.msgText).then(()=>toast('Message copied'),()=>toast('Copy failed'))}catch(e){toast('Copy failed')}},
'del-contact'(){const c=D.list.find(x=>x.id==S.detail);sheet('Delete '+c.name+'?',`<p class="text-body-md text-on-surface-variant mb-4">This hides the contact and its ${c.tx.length} records. You can restore it from Settings, under Recently deleted.</p><div class="grid grid-cols-2 gap-2"><button data-a="close" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Keep</button><button data-a="del-yes" class="h-12 rounded-[14px] bg-error text-white text-label-lg">Delete</button></div>`)},
'del-yes'(){const c=D.list.find(x=>x.id==S.detail);c.del=Date.now();D.trash.push(c);D.list=D.list.filter(x=>x.id!=S.detail);save();close();toast('Moved to Recently deleted');S.screen='main';render()},
'skip-splash'(){boot()},
'void-tx'(){const c=D.list.find(x=>x.id==S.detail),x=c.tx.find(t=>t.id==S.tid);x.void=Date.now();save();close();toast('Entry voided');render()},
trash(){const t=D.trash;sheet('Recently deleted',t.length?`<div class="flex flex-col gap-2">${t.map(c=>`<div class="flex items-center justify-between p-3 rounded-xl bg-surface-container-low"><span class="text-label-lg truncate">${esc(c.name)}</span><button data-a="undelete" data-v="${c.id}" class="px-3 h-9 rounded-full bg-primary text-on-primary text-label-md">Restore</button></div>`).join('')}</div>`:'<p class="text-body-md text-on-surface-variant">Nothing deleted.</p>')},
undelete(v){const c=D.trash.find(x=>x.id==v);if(!c)return;delete c.del;D.list.push(c);D.trash=D.trash.filter(x=>x.id!=v);save();close();toast(c.name+' restored');render()},
backup(){const j=JSON.stringify({v:2,list:D.list,trash:D.trash,user:D.user,biz:D.biz,phone:D.phone,loc:D.loc,cur:D.cur,cc:D.cc});sheet('Back up your data',`<p class="text-body-md text-on-surface-variant mb-3">Copy this text and keep it somewhere safe, such as a note or an email to yourself.</p><textarea id="bk" readonly class="${inp} h-32 py-3 text-body-sm">${esc(j)}</textarea><button data-a="copy-bk" class="${btnP} mt-3">Copy backup</button>`)},
'copy-bk'(){const t=$('#bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Backup copied'),()=>toast('Press and hold to copy the selected text'))}catch(e){toast('Press and hold to copy the selected text')}},
'restore-bk'(){sheet('Restore from backup',`<textarea id="rb" class="${inp} h-32 py-3 text-body-sm" placeholder="Paste your backup here"></textarea><p id="rb-e" role="alert" class="hidden text-body-sm text-error mt-1"></p><p class="text-body-sm text-on-surface-variant mt-2">This replaces the contacts and records on this device.</p><button data-a="do-restore" class="${btnP} mt-3">Restore</button>`)},
region(){sheet('Currency and country',`<div class="flex flex-col gap-3">${fld('r-cur','Currency symbol','GH₵',D.cur||'GH₵','maxlength="5"')}${fld('r-cc','Country dialing code','233',D.cc||'233','inputmode="numeric" maxlength="4"')}<button data-a="save-region" class="${btnP}">Save</button></div>`)},
forgot(){sheet('Forgot your PIN?',`<p class="text-body-md text-on-surface-variant mb-4">A PIN can’t be recovered. You can erase everything on this device and start fresh, then restore from a backup if you made one.</p><div class="grid grid-cols-2 gap-2"><button data-a="close" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Cancel</button><button data-a="forgot-yes" class="h-12 rounded-[14px] bg-error text-white text-label-lg">Erase and reset</button></div>`)},
'forgot-yes'(){D.list=[];D.trash=[];D.pin=null;D.salt=null;D.tries=0;D.lockUntil=0;save();close();toast('Data erased and PIN removed');enter()},
'prof-back'(){S.slide=2;go('onboard')},
wipe(){sheet('Erase everything?',`<p class="text-body-md text-on-surface-variant mb-4">All contacts and records on this device will be deleted. It can’t be undone.</p><div class="grid grid-cols-2 gap-2"><button data-a="close" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Cancel</button><button data-a="wipe-yes" class="h-12 rounded-[14px] bg-error text-white text-label-lg">Erase</button></div>`)},
'wipe-yes'(){D.list=[];D.trash=[];save();close();toast('Everything erased');render()}};


const openC=id=>{S.detail=id;S.screen='detail';try{history.pushState({d:1},'')}catch(e){}render()};
const owed=(c,k)=>{const b=bal(c);return k=='get'?Math.max(b,0):k=='pay'?Math.max(-b,0):null};
const fmt=a=>Math.floor(a/100)+'.'+String(a%100).padStart(2,'0');
function txPrev(){const c=D.list.find(x=>x.id==S.detail),e=$('#f-prev');if(!c||!e)return;S.ow=false;const w=$('#f-warn');w&&w.classList.add('hidden');const sb=$('#f-save');sb&&(sb.textContent='Save '+txMeta[S.k][0].toLowerCase());const v=cents($('#f-amt').value);if(!v){e.textContent='';return}const nb=bal(c)+v*txMeta[S.k][1];e.textContent='New balance: '+(nb<0?'−':'')+money(nb)+(nb>0?' (they owe you)':nb<0?' (you owe them)':' (settled)')}
function ferr(id,m){const e=$('#'+id+'-e'),i=$('#'+id);if(e){e.textContent=m;e.classList.remove('hidden')}if(i){i.setAttribute('aria-invalid','true');i.classList.add('ring-2','ring-error','shake');setTimeout(()=>i.classList.remove('shake'),400);i.focus()}}
function cmsg(m){const e=$('#cmsg');if(e){e.textContent=m;e.classList.remove('hidden')}}
function imp(arr){let add=0,dup=0,bad=0;const t=S.ct||'customer';arr.forEach(p=>{const n=String(p.name||'').trim().slice(0,60),ph=String(p.phone||'').trim();if(!n){bad++;return}if(ph&&chkPh(ph,null)){dup++;return}D.list.push({id:uid(),name:n,phone:ph,loc:'',type:t,created:Date.now(),tx:[]});add++});if(add)save();S.cres={add,dup,bad};render()}
function vcf(t){return t.replace(/\r?\n[ \t]/g,'').split(/BEGIN:VCARD/i).slice(1).map(b=>{const g=k=>(b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','im'))||[])[1]||'';const tels=[...b.matchAll(/^TEL[^:\n]*:(.*)$/gim)].map(m=>m[1].trim());let n=g('FN').trim();if(!n)n=g('N').split(';').filter(Boolean).reverse().join(' ').trim();return{name:n,phone:tels.find(okPh)||''}})}
Object.assign(A,{
ctype(v){S.ct=v;render()},
'imp-open'(){S.setup=false;S.cres=null;S.rt=S.tab;S.screen='contacts';render()},
'cont-back'(){go('profile')},
'cont-done'(){S.cres=null;if(S.setup){S.pm='set';go('pin')}else{S.screen='main';S.tab=S.rt||'settings';render()}},
'pick-file'(){$('#vcf').click()},
async 'pick-contacts'(){try{const r=await navigator.contacts.select(['name','tel'],{multiple:true});if(!r.length)return cmsg('No contacts were selected. Try again, or skip for now.');imp(r.map(p=>({name:(p.name||[])[0],phone:(p.tel||[]).map(String).find(okPh)||''})))}catch(e){cmsg(e&&e.name=='SecurityError'?'This page isn’t allowed to open your contacts. Open Kura in Chrome on Android, or import a .vcf file instead.':'Couldn’t open your contacts. Try again, import a .vcf file, or skip for now.')}},
add(){S.t='customer';sheet('Add contact',`<div class="flex flex-col gap-3">${fld('f-name','Full name','e.g. Ama Serwaa','','autocomplete="off" maxlength="60"')}${fld('f-phone','Phone number (optional)','e.g. 024 123 4567','','inputmode="tel"')}${fld('f-loc','Location or landmark (optional)','e.g. Madina market','','autocomplete="off" maxlength="80"')}<div class="grid grid-cols-2 gap-2">${[['customer','Customer'],['supplier','Supplier']].map(([k,l],i)=>`<button data-a="type" data-v="${k}" class="h-11 rounded-xl text-label-lg ${i?'bg-surface-container-low':'bg-primary text-on-primary'}">${l}</button>`).join('')}</div><button data-a="save-c" class="${btnP} mt-1">Save contact</button></div>`)},
'save-c'(){const n=$('#f-name').value.trim();if(!n)return ferr('f-name','Enter a name');const ph=$('#f-phone').value.trim(),er=chkPh(ph,null);if(er)return ferr('f-phone',er);const c={id:uid(),name:n,phone:ph,loc:$('#f-loc').value.trim(),type:S.t=='supplier'?'supplier':'customer',created:Date.now(),tx:[]};S.t=null;D.list.push(c);save();close();toast(n+' added');openC(c.id)},
tx(k){const m=txMeta[k];S.k=k;S.ow=false;sheet(m[0],`<div class="flex flex-col gap-3"><div><label for="f-amt" class="text-label-md text-on-surface-variant mb-1 block">Amount (${esc(D.cur||'GH₵')})</label><input id="f-amt" class="${inp} text-headline-sm" inputmode="decimal" placeholder="0.00" autocomplete="off"><p id="f-amt-e" role="alert" class="hidden text-body-sm text-error mt-1"></p><p id="f-prev" class="text-body-sm text-on-surface-variant mt-1 min-h-4"></p></div>${fld('f-note','Note',m[2],'','autocomplete="off" maxlength="120"')}<div id="f-warn" role="alert" class="hidden p-3 rounded-xl bg-[#fff4d6] text-body-sm"></div><button id="f-save" data-a="save-tx" class="${btnP}">Save ${m[0].toLowerCase()}</button></div>`)},
'save-tx'(){const c=D.list.find(x=>x.id==S.detail),m=txMeta[S.k],v=cents($('#f-amt').value);if(!v)return ferr('f-amt',amtErr($('#f-amt').value));
const ow=owed(c,S.k);if(ow!==null&&v>ow&&!S.ow){S.ow=true;const w=$('#f-warn');w.textContent=ow?'This is '+money(v-ow)+' more than the '+money(ow)+' balance. Saving will flip the balance the other way.':'There is nothing to settle here. Saving will create a balance the other way.';w.classList.remove('hidden');$('#f-save').textContent='Save anyway';return}
S.ow=false;c.tx.push({id:uid(),amt:v*m[1],note:$('#f-note').value.trim().slice(0,120),ts:Date.now()});save();close();toast(m[0]+' saved');render()},
remind(){const c=D.list.find(x=>x.id==S.detail);if(!c.phone){sheet('Add a phone number',`<div class="flex flex-col gap-3">${fld('f-ph','Phone number','e.g. 024 123 4567','','inputmode="tel"')}<button data-a="save-ph" class="${btnP}">Save and continue</button></div>`);return}
const t=`Hello ${c.name}, a friendly reminder that you have an outstanding balance of ${money(bal(c))}${D.biz?' with '+D.biz:''}. Thank you!`,u='https://wa.me/'+wa(c.phone)+'?text='+encodeURIComponent(t);S.msgText=t;
sheet('Send on WhatsApp',`<p class="text-body-md text-on-surface-variant mb-3">${esc(t)}</p><div class="flex flex-col gap-2"><a href="${esc(u)}" target="_blank" rel="noopener" data-a="close" class="${btnP}">Open WhatsApp</a><button data-a="copy-msg" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Copy message</button></div>`)},
'save-ph'(){const v=$('#f-ph').value.trim(),er=!okPh(v)?'Enter a valid phone number':chkPh(v,S.detail);if(er)return ferr('f-ph',er);D.list.find(x=>x.id==S.detail).phone=v;save();A.remind()},
'edit-c'(){const c=D.list.find(x=>x.id==S.detail);sheet('Edit details',`<div class="flex flex-col gap-3">${fld('e-name','Full name','',c.name,'autocomplete="off" maxlength="60"')}${fld('e-phone','Phone number','Optional',c.phone||'','inputmode="tel"')}${fld('e-loc','Location or landmark','Optional',c.loc||'','autocomplete="off" maxlength="80"')}<button data-a="save-edit" class="${btnP}">Save changes</button></div>`)},
'save-edit'(){const c=D.list.find(x=>x.id==S.detail),n=$('#e-name').value.trim();if(!n)return ferr('e-name','Enter a name');const ph=$('#e-phone').value.trim(),er=chkPh(ph,c.id);if(er)return ferr('e-phone',er);c.name=n;c.phone=ph;c.loc=$('#e-loc').value.trim();save();close();toast('Details saved');render()},
'edit-tx'(v){const c=D.list.find(x=>x.id==S.detail),x=c.tx.find(t=>t.id==v);if(!x||x.void)return;S.tid=v;sheet('Edit entry',`<div class="flex flex-col gap-3">${fld('t-amt','Amount ('+esc(D.cur||'GH₵')+')','0.00',fmt(Math.abs(x.amt)),'inputmode="decimal" autocomplete="off"')}${fld('t-note','Note','Optional',x.note||'','maxlength="120"')}<p class="text-body-sm text-on-surface-variant">The original stays in the history, marked as voided.</p><button data-a="save-fix" class="${btnP}">Save correction</button><button data-a="void-tx" class="h-12 rounded-[14px] bg-error-container text-on-error-container text-label-lg">Void this entry</button></div>`)},
'save-fix'(){const c=D.list.find(x=>x.id==S.detail),x=c.tx.find(t=>t.id==S.tid),v=cents($('#t-amt').value),n=$('#t-note').value.trim().slice(0,120);if(!v)return ferr('t-amt',amtErr($('#t-amt').value));const p=v*Math.sign(x.amt);if(p==x.amt&&n==(x.note||''))return close();x.void=Date.now();c.tx.push({id:uid(),amt:p,note:n,ts:x.ts,fix:x.id});save();close();toast('Entry corrected');render()},
'do-restore'(){let o;try{o=JSON.parse($('#rb').value)}catch(e){}if(!o||o.v!=2||!Array.isArray(o.list))return ferr('rb','That isn’t a valid Kura backup');D.list=cleanList(o.list);D.trash=cleanList(o.trash);['user','biz','phone','loc'].forEach(k=>typeof o[k]=='string'&&(D[k]=o[k].slice(0,80)));if(o.cur)D.cur=cleanCur(o.cur);if(o.cc)D.cc=String(o.cc).replace(/\D/g,'').slice(0,4)||D.cc;save();close();toast('Backup restored');render()},
'save-region'(){const cu=cleanCur($('#r-cur').value),cc=$('#r-cc').value.replace(/\D/g,'');if(!$('#r-cur').value.trim())return ferr('r-cur','Enter a currency symbol');if(!cc)return ferr('r-cc','Enter a dialing code, like 233');D.cur=cu;D.cc=cc;save();close();toast('Saved');render()},
'save-profile'(){const n=$('#p-name').value.trim();if(!n)return ferr('p-name','Enter your name to continue');const ph=$('#p-phone').value.trim();if(ph&&!okPh(ph))return ferr('p-phone','Enter a valid phone number, or leave it empty');D.user=n.slice(0,60);D.biz=$('#p-biz').value.trim();D.phone=ph;D.loc=$('#p-loc').value.trim();D.onboarded=true;S.setup=true;S.cres=null;save();go('contacts')},
'edit-profile'(){sheet('Your profile',`<div class="flex flex-col gap-3">${fld('e-user','Your name','',D.user,'maxlength="60"')}${fld('e-biz','Business name','Optional',D.biz||'')}${fld('e-phone','Phone number','Optional',D.phone||'','inputmode="tel"')}${fld('e-loc','Business location','Optional',D.loc||'')}<button data-a="save-prof" class="${btnP}">Save profile</button></div>`)},
'save-prof'(){const n=$('#e-user').value.trim();if(!n)return ferr('e-user','Enter your name');const ph=$('#e-phone').value.trim();if(ph&&!okPh(ph))return ferr('e-phone','Enter a valid phone number, or leave it empty');D.user=n;D.biz=$('#e-biz').value.trim();D.phone=ph;D.loc=$('#e-loc').value.trim();save();close();toast('Profile saved');render()},
'toggle-pin'(){if(D.pin){sheet('Remove PIN lock?',`<p class="text-body-md text-on-surface-variant mb-4">Anyone who opens this app on your phone will be able to see your ledger.</p><div class="grid grid-cols-2 gap-2"><button data-a="close" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Keep PIN</button><button data-a="pin-off" class="h-12 rounded-[14px] bg-error text-white text-label-lg">Remove</button></div>`)}else{S.pm='set';go('pin')}},
'pin-off'(){D.pin=null;D.salt=null;save();close();toast('PIN removed');render()},
reset(){sheet('Load sample data?',`<p class="text-body-md text-on-surface-variant mb-4">This replaces your current contacts and records with sample ones. Back up first if your records are real.</p><div class="grid grid-cols-2 gap-2"><button data-a="close" class="h-12 rounded-[14px] bg-surface-container-low text-label-lg">Cancel</button><button data-a="reset-yes" class="h-12 rounded-[14px] bg-error text-white text-label-lg">Replace</button></div>`)},
'reset-yes'(){D.list=seed();D.trash=[];save();close();toast('Sample data loaded');render()}});
document.addEventListener('change',e=>{if(e.target.id!='vcf')return;const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>5e6)return cmsg('That file is too large.');const r=new FileReader();r.onload=()=>{const l=vcf(String(r.result));l.length?imp(l):cmsg('No contacts found in that file. Export as vCard (.vcf) and try again.')};r.onerror=()=>cmsg('Couldn’t read that file.');r.readAsText(f)});

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];f&&f(el.dataset.v,el)});
document.addEventListener('input',e=>{const i=e.target,er=i.id&&$('#'+i.id+'-e');if(er){er.classList.add('hidden');i.classList.remove('ring-2','ring-error');i.removeAttribute('aria-invalid')}if(i.id=='f-amt')txPrev();if(e.target.id=='q'){S.q=e.target.value.trim().toLowerCase();$('#list').innerHTML=lists()}});
let x0=null;document.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(S.screen!='onboard'||x0==null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(d<-60&&S.slide<2){S.slide++;render()}else if(d>60&&S.slide>0){S.slide--;render()}},{passive:true});

/* ---------- boot ---------- */
setInterval(()=>{const e=$('#clock');if(e)e.textContent=now()},15000);
render();
function boot(){if(S.screen!='splash')return;if(!D.onboarded)go('onboard');else if(D.pin){S.pm='lock';go('pin')}else enter()}
setTimeout(boot,2600);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.hidden)S.hid=Date.now();else if(D.pin&&S.hid&&Date.now()-S.hid>30000&&['main','detail'].includes(S.screen)){close();S.pm='lock';go('pin')}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')close();if((e.key=='Enter'||e.key==' ')&&e.target.matches&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
window.addEventListener('popstate',()=>{close();if(S.screen=='detail'){S.screen='main';render()}});
</script></body></html>
